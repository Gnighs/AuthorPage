<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f7f3eb">
    <title>Newsletter | Pau Roca Pardo</title>
    <link rel="icon" href="../favicon.ico" sizes="any">
    <link rel="stylesheet" href="../src/styles.css">
  </head>
  <body class="author-site">
    <header class="author-header">
      <a class="author-name" href="../index.html">Pau Roca Pardo</a>
      <nav class="author-nav" aria-label="Primary navigation">
        <a href="../index.html">Home</a>
        <a href="../books/index.html">Books</a>
        <a href="../about/index.html">About</a>
        <a aria-current="page" href="./index.html">Newsletter</a>
        <a href="../l9archive/index.html">L9 Archive</a>
      </nav>
    </header>

    <main class="author-main">
      <section class="author-page-heading">
        <p class="author-kicker">Newsletter</p>
        <h1>Letters from the desk</h1>
        <p>Updates on fiction, language-building, research notes, and new public records from the archive.</p>
      </section>

      <form class="newsletter-form" action="#" method="post">
        <label for="newsletter-email">Email address</label>
        <div>
          <input id="newsletter-email" name="email" type="email" autocomplete="email" placeholder="you@example.com" required>
          <button type="submit">Notify me</button>
        </div>
        <p data-form-note>Signup is not connected yet.</p>
      </form>
    </main>

    <footer class="author-footer">
      <p>© 2026 Pau Roca Pardo. All rights reserved.</p>
    </footer>
    <script>
      document.querySelector(".newsletter-form").addEventListener("submit", (event) => {
        event.preventDefault();
        event.currentTarget.querySelector("[data-form-note]").textContent =
          "Thanks. This form is a placeholder until the newsletter service is connected.";
      });
    </script>
  </body>
</html>
